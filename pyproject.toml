[project]
name = "opulent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JP Etcheber", email = "jetcheber@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "bleach>=6.4.0",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "jinja2>=3.1.6",
    "markdown>=3.11",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pygments>=2.21.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
opulent = "opulent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

