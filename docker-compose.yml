services:
  db:
    image: postgres:16-alpine
    container_name: opulent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opulent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opulent_secret}
      POSTGRES_DB: ${POSTGRES_DB:-opulent}
    volumes:
      - opulent_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opulent} -d ${POSTGRES_DB:-opulent}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opulent-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-opulent}:${POSTGRES_PASSWORD:-opulent_secret}@db:5432/${POSTGRES_DB:-opulent}
      HOST: 0.0.0.0
      PORT: 8000
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  opulent_postgres_data:
    driver: local
