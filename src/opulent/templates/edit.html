{% extends "base.html" %}

{% block title %}Edit {{ document.title }} - Opulent{% endblock %}

{% block content %}
  {% if error %}
    <div class="alert alert-error">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
  {% endif %}

  <div class="card editor-card">
    <div class="card-header">
      <div class="card-title">
        <span>✏️</span>
        <span>Edit Document</span>
        <span class="badge badge-gold">v{{ document.current_version }}</span>
      </div>
      <div>
        <a href="/docs/{{ document.doc_id }}" class="btn btn-secondary btn-sm">Cancel</a>
      </div>
    </div>
    <div class="card-body editor-card-body">
      <form id="editor-form" action="/docs/{{ document.doc_id }}/edit" method="post" class="editor-form">
        <div class="form-row">
          <div class="form-group" style="flex: 2;">
            <label for="doc-title" class="form-label">Title</label>
            <input
              type="text"
              id="doc-title"
              name="title"
              class="form-input"
              value="{{ document.title }}"
              placeholder="Document Title"
              maxlength="255"
              autofocus
            />
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="doc-format" class="form-label">Syntax / Format</label>
            <select id="doc-format" name="format" class="form-select">
              {% for key, label in formats.items() %}
                <option value="{{ key }}" {% if key == document.format %}selected{% endif %}>
                  {{ label }}
                </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-group editor-content-group">
          <label for="doc-content-input" class="form-label">Document Content</label>
          <textarea
            id="doc-content-input"
            name="content"
            class="form-textarea"
            placeholder="Edit document content..."
            required
          >{{ document.content }}</textarea>
        </div>

        <div class="editor-footer">
          <div class="editor-stats">
            <span id="stat-lines">0 lines</span>
            <span>•</span>
            <span id="stat-words">0 words</span>
            <span>•</span>
            <span id="stat-chars">0 chars</span>
          </div>

          <div style="display: flex; gap: 0.75rem;">
            <a href="/docs/{{ document.doc_id }}" class="btn btn-secondary">
              Cancel
            </a>
            <button type="submit" class="btn btn-primary">
              <span>💾 Save Changes (New Version)</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
