{% extends "base.html" %}

{% block title %}Opulent - Create & Share Formatted Documents{% endblock %}

{% block content %}
  {% if error %}
    <div class="alert alert-error">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
  {% endif %}

  {% if notice %}
    <div class="alert alert-info">
      <span>ℹ️</span>
      <span>{{ notice }}</span>
    </div>
  {% endif %}

  <!-- Document Editor Section (Fills viewport length) -->
  <div class="card editor-card">
    <div class="card-body editor-card-body">
      <form id="editor-form" action="/docs" method="post" class="editor-form">
        <div class="form-row">
          <div class="form-group" style="flex: 2;">
            <label for="doc-title" class="form-label">Title</label>
            <input
              type="text"
              id="doc-title"
              name="title"
              class="form-input"
              placeholder="Document Title (e.g. System Architecture Notes, Untitled)"
              maxlength="255"
              autofocus
            />
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="doc-format" class="form-label">Syntax / Format</label>
            <select id="doc-format" name="format" class="form-select">
              {% for key, label in formats.items() %}
                <option value="{{ key }}" {% if key == 'markdown' %}selected{% endif %}>
                  {{ label }}
                </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-group editor-content-group">
          <label for="doc-content-input" class="form-label">Document Content</label>
          <textarea
            id="doc-content-input"
            name="content"
            class="form-textarea"
            placeholder="Write or paste your markdown, code, or plain text here... (Ctrl+Enter to publish)"
            required
          ></textarea>
        </div>

        <div class="editor-footer">
          <div class="editor-stats">
            <span id="stat-lines">0 lines</span>
            <span>•</span>
            <span id="stat-words">0 words</span>
            <span>•</span>
            <span id="stat-chars">0 chars</span>
          </div>

          <button type="submit" class="btn btn-primary">
            <span>✨ Publish Document</span>
          </button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
